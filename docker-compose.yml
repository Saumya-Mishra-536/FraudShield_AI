services:
  api:
    build: .
    command: ["uvicorn", "src.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      MODEL_DIR: /app/models
      FRAUDSHIELD_ENV: ${FRAUDSHIELD_ENV:-development}
      FRAUDSHIELD_API_KEY: ${FRAUDSHIELD_API_KEY:-}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-60}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  dashboard:
    build: .
    command: ["streamlit", "run", "src/dashboard.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    environment:
      MODEL_DIR: /app/models
      OUTPUT_DIR: /app/outputs
      FRAUDSHIELD_API_URL: http://api:8000
      FRAUDSHIELD_API_KEY: ${FRAUDSHIELD_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8501:8501"
